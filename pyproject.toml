[project]
name = "cms"
version = "0.1.0"
description = "DB 중심 CMS 분석 및 아카이브 유틸리티"
requires-python = ">=3.12,<3.13"
readme = "README.md"

[tool.ruff]
target-version = "py312"
line-length = 140
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that require local scratch database services or explicit environment guards",
]

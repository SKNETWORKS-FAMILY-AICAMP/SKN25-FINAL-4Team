apiVersion: 1

contactPoints:
  - orgId: 1
    name: Discord Live Pipeline Alerts
    receivers:
      - uid: discord-live-pipeline-alerts
        type: discord
        settings:
          url: ${GRAFANA_DISCORD_WEBHOOK_URL}
          title: '[{{ .Status | toUpper }}] CMS live pipeline alert'
          message: |
            {{ range .Alerts }}
            Severity: {{ .Labels.severity }}
            Rule: {{ .Labels.alertname }}
            Summary: {{ .Annotations.summary }}
            Runbook: {{ .Annotations.runbook_url }}
            {{ end }}

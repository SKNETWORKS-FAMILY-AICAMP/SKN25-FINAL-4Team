name: cms-stream-runtime
services:
  cms-kafka:
    image: apache/kafka:3.7.1
    container_name: cms-kafka-1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@cms-kafka:9093,2@cms-kafka-2:9093,3@cms-kafka-3:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://cms-kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS:-24}
      KAFKA_LOG_RETENTION_BYTES: ${KAFKA_LOG_RETENTION_BYTES:-1073741824}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:-3}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR:-3}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${KAFKA_TRANSACTION_STATE_LOG_MIN_ISR:-2}
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-Q01TX1BIT1NFNF9DTFVTVEVS}
      KAFKA_DEFAULT_REPLICATION_FACTOR: ${KAFKA_DEFAULT_REPLICATION_FACTOR:-3}
      KAFKA_MIN_INSYNC_REPLICAS: ${KAFKA_MIN_INSYNC_REPLICAS:-2}
    volumes:
    - cms_kafka_1_data:/var/lib/kafka/data
    networks:
    - cms_stream
  cms-kafka-init:
    image: apache/kafka:3.7.1
    container_name: cms-kafka-init
    depends_on:
    - cms-kafka
    - cms-kafka-2
    - cms-kafka-3
    restart: 'no'
    command:
    - bash
    - -ec
    - "BOOTSTRAP=\"cms-kafka:9092,cms-kafka-2:9092,cms-kafka-3:9092\"\nfor i in {1..60};\
      \ do\n  /opt/kafka/bin/kafka-topics.sh --bootstrap-server \"$$BOOTSTRAP\" --list\
      \ >/dev/null 2>&1 && break\n  sleep 2\ndone\n/opt/kafka/bin/kafka-topics.sh\
      \ --bootstrap-server \"$$BOOTSTRAP\" --create --if-not-exists --topic measurement_raw_v1\
      \ --partitions ${KAFKA_RAW_PARTITIONS:-3} --replication-factor ${KAFKA_RAW_REPLICATION_FACTOR:-3}\n\
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server \"$$BOOTSTRAP\" --create --if-not-exists\
      \ --topic measurement_dead_letter_v1 --partitions ${KAFKA_DLQ_PARTITIONS:-1}\
      \ --replication-factor ${KAFKA_DLQ_REPLICATION_FACTOR:-3}\n"
    networks:
    - cms_stream
  cms-api:
    build:
      context: ../..
      dockerfile: stacks/stream_runtime/Dockerfile
    image: cms:phase1
    container_name: cms-api
    restart: unless-stopped
    depends_on:
    - cms-kafka-init
    env_file:
    - path: ../../env/stream.env.example
      required: false
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-cms-kafka:9092,cms-kafka-2:9092,cms-kafka-3:9092}
      MEASUREMENT_RAW_TOPIC: ${MEASUREMENT_RAW_TOPIC:-measurement_raw_v1}
      MEASUREMENT_DLQ_TOPIC: ${MEASUREMENT_DLQ_TOPIC:-measurement_dead_letter_v1}
      CMS_ENABLE_RUNTIME_KAFKA_PRODUCER: ${CMS_ENABLE_RUNTIME_KAFKA_PRODUCER:-1}
      ALLOW_CANONICAL_WRITE: '0'
      ALLOW_PRODUCTION_DDL: '0'
    command:
    - python
    - -m
    - uvicorn
    - cms.service.api:create_app
    - --factory
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    ports:
    - ${CMS_API_BIND:-127.0.0.1}:${CMS_API_PORT:-8000}:8000
    volumes:
    - ${CMS_LIVE_SOURCE_DIR:-./source_mounts/live_source}:/home/ubuntu/cms-stream-deploy/data/live_source:ro
    networks:
    - cms_stream
  cms-kafka-to-postgres-consumer:
    image: cms:phase1
    container_name: cms-kafka-consumer
    restart: unless-stopped
    depends_on:
    - cms-kafka-init
    env_file:
    - path: ../../env/stream.env.example
      required: false
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-cms-kafka:9092,cms-kafka-2:9092,cms-kafka-3:9092}
      MEASUREMENT_RAW_TOPIC: ${MEASUREMENT_RAW_TOPIC:-measurement_raw_v1}
      KAFKA_TOPIC_IDENTITY: ${KAFKA_TOPIC_IDENTITY:-local_pc123.measurement_raw_v1}
      MEASUREMENT_DLQ_TOPIC: ${MEASUREMENT_DLQ_TOPIC:-measurement_dead_letter_v1}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-postgres-live-ingest}
      POSTGRES_HOST: ${POSTGRES_HOST:-172.31.47.236}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-cms}
      POSTGRES_USER: ${POSTGRES_USER:-cms}
      ALLOW_CANONICAL_WRITE: '0'
      ALLOW_PRODUCTION_DDL: '0'
    command:
    - python
    - scripts/live/run_consumer_service.py
    - --dry-run
    networks:
    - cms_stream
  cms-kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    container_name: cms-kafka-exporter
    restart: unless-stopped
    depends_on:
    - cms-kafka-init
    command:
    - --kafka.server=cms-kafka:9092
    - --kafka.server=cms-kafka-2:9092
    - --kafka.server=cms-kafka-3:9092
    - --web.listen-address=:9308
    networks:
    - cms_stream
  cms-node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: cms-node-exporter
    restart: unless-stopped
    pid: host
    command:
    - --path.rootfs=/host/root
    - --web.listen-address=:9100
    volumes:
    - /:/host/root:ro,rslave
    networks:
    - cms_stream
  cms-prometheus:
    image: prom/prometheus:v2.55.1
    container_name: cms-prometheus
    restart: unless-stopped
    depends_on:
    - cms-kafka-exporter
    - cms-node-exporter
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-7d}
    ports:
    - ${PROMETHEUS_BIND:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090
    volumes:
    - ../../configs/prometheus/stream_runtime.yml:/etc/prometheus/prometheus.yml:ro
    - cms_prometheus_data:/prometheus
    networks:
    - cms_stream
  cms-kafka-2:
    image: apache/kafka:3.7.1
    container_name: cms-kafka-2
    restart: unless-stopped
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-Q01TX1BIT1NFNF9DTFVTVEVS}
      KAFKA_NODE_ID: '2'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@cms-kafka:9093,2@cms-kafka-2:9093,3@cms-kafka-3:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://cms-kafka-2:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS:-24}
      KAFKA_LOG_RETENTION_BYTES: ${KAFKA_LOG_RETENTION_BYTES:-1073741824}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:-3}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR:-3}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${KAFKA_TRANSACTION_STATE_LOG_MIN_ISR:-2}
      KAFKA_DEFAULT_REPLICATION_FACTOR: ${KAFKA_DEFAULT_REPLICATION_FACTOR:-3}
      KAFKA_MIN_INSYNC_REPLICAS: ${KAFKA_MIN_INSYNC_REPLICAS:-2}
    volumes:
    - cms_kafka_2_data:/var/lib/kafka/data
    networks:
    - cms_stream
  cms-kafka-3:
    image: apache/kafka:3.7.1
    container_name: cms-kafka-3
    restart: unless-stopped
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-Q01TX1BIT1NFNF9DTFVTVEVS}
      KAFKA_NODE_ID: '3'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@cms-kafka:9093,2@cms-kafka-2:9093,3@cms-kafka-3:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://cms-kafka-3:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS:-24}
      KAFKA_LOG_RETENTION_BYTES: ${KAFKA_LOG_RETENTION_BYTES:-1073741824}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:-3}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR:-3}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${KAFKA_TRANSACTION_STATE_LOG_MIN_ISR:-2}
      KAFKA_DEFAULT_REPLICATION_FACTOR: ${KAFKA_DEFAULT_REPLICATION_FACTOR:-3}
      KAFKA_MIN_INSYNC_REPLICAS: ${KAFKA_MIN_INSYNC_REPLICAS:-2}
    volumes:
    - cms_kafka_3_data:/var/lib/kafka/data
    networks:
    - cms_stream
networks:
  cms_stream:
    name: cms_stream
volumes:
  cms_prometheus_data:
    name: cms_prometheus_data
  cms_kafka_1_data:
    name: cms_kafka_1_data
  cms_kafka_2_data:
    name: cms_kafka_2_data
  cms_kafka_3_data:
    name: cms_kafka_3_data

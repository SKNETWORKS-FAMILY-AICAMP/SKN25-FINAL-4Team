<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,1 L9,5 L0,9 Z" fill="#334155"/></marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,1 L9,5 L0,9 Z" fill="#2563eb"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,1 L9,5 L0,9 Z" fill="#16a34a"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,1 L9,5 L0,9 Z" fill="#7c3aed"/></marker>
    <style>
      .bg { fill: #f8fafc; }
      .outer { fill: #ffffff; stroke: #0f172a; stroke-width: 2.2; }
      .title { font: 700 29px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 15px Arial, sans-serif; fill: #475569; }
      .section-title { font: 700 16px Arial, sans-serif; fill: #0f172a; }
      .label { font: 700 13px Arial, sans-serif; fill: #0f172a; }
      .body { font: 12px Arial, sans-serif; fill: #334155; }
      .tiny { font: 11px Arial, sans-serif; fill: #64748b; }
      .badge-text { font: 700 10px Arial, sans-serif; fill: #ffffff; }
      .section { fill: #ffffff; stroke-width: 1.7; rx: 16; }
      .ingest { stroke: #2563eb; fill: #eff6ff; }
      .db { stroke: #0f766e; fill: #f0fdfa; }
      .service { stroke: #ea580c; fill: #fff7ed; }
      .observed { stroke: #16a34a; fill: #f0fdf4; }
      .model { stroke: #7c3aed; fill: #faf5ff; }
      .observe { stroke: #64748b; fill: #f8fafc; }
      .node { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; rx: 10; }
      .flow { stroke: #334155; stroke-width: 1.9; fill: none; marker-end: url(#arrow); }
      .flow-blue { stroke: #2563eb; stroke-width: 2.1; fill: none; marker-end: url(#arrow-blue); }
      .flow-green { stroke: #16a34a; stroke-width: 2.1; fill: none; marker-end: url(#arrow-green); }
      .flow-purple { stroke: #7c3aed; stroke-width: 2.1; fill: none; marker-end: url(#arrow-purple); }
      .read { stroke: #64748b; stroke-width: 1.6; fill: none; stroke-dasharray: 7 5; marker-end: url(#arrow); }
    </style>
  </defs>


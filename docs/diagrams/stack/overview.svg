    <rect x="214" y="0" width="24" height="24" rx="6" fill="#61dafb"/><text x="226" y="16" text-anchor="middle" class="badge-text">R</text>
    <rect x="246" y="0" width="24" height="24" rx="6" fill="#f97316"/><text x="258" y="16" text-anchor="middle" class="badge-text">G</text>

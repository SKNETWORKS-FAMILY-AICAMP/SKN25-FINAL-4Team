    <text x="74" y="23" text-anchor="middle" class="label">Frontend</text>
    <text x="74" y="42" text-anchor="middle" class="tiny">운영 UI</text>
  </g>
  <g transform="translate(1084,190)">
    <rect width="124" height="56" class="node"/>

<svg width="1500" height="900" viewBox="0 0 1500 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">CMS overview architecture</title>
  <desc id="desc">Technology-stack interaction overview for CMS. Source and replay producers publish to Kafka, Kafka feeds PostgreSQL, and service, workflow, model, knowledge, and observability stacks interact around PostgreSQL.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M2 2 L10 6 L2 10 Z" fill="#2563eb"/></marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M2 2 L10 6 L2 10 Z" fill="#059669"/></marker>
    <marker id="arrowDark" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M2 2 L10 6 L2 10 Z" fill="#334155"/></marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 32px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #475569; }
      .zone-title { font: 700 15px Arial, sans-serif; fill: #1e293b; letter-spacing: .02em; }
      .node-title { font: 700 20px Arial, sans-serif; fill: #0f172a; }
      .node-sub { font: 400 13px Arial, sans-serif; fill: #475569; }
      .badge { font: 700 12px Arial, sans-serif; fill: white; }
      .legend-title { font: 700 15px Arial, sans-serif; fill: #334155; }
      .legend-text { font: 400 13px Arial, sans-serif; fill: #475569; }
      .stream { stroke: #2563eb; stroke-width: 3.0; marker-end: url(#arrowBlue); fill: none; }
      .service { stroke: #059669; stroke-width: 2.8; marker-end: url(#arrowGreen); fill: none; }
      .work { stroke: #334155; stroke-width: 2.4; marker-end: url(#arrowDark); fill: none; }
      .observe { stroke: #94a3b8; stroke-width: 1.8; stroke-dasharray: 7 8; fill: none; opacity: .72; }
    </style>
  </defs>

  <rect class="bg" width="1500" height="900"/>
  <rect x="36" y="32" width="1428" height="836" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="72" y="84" class="title">CMS Overview Architecture</text>
  <text x="72" y="112" class="subtitle">Technology-stack interaction map. Kafka owns live/backfill stream; pipeline diagrams keep the detailed processing view.</text>

  <rect x="70" y="155" width="330" height="520" rx="22" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="98" y="192" class="zone-title">DATA STREAM</text>
  <rect x="440" y="155" width="310" height="520" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="468" y="192" class="zone-title">CORE DATA STORE</text>
  <rect x="790" y="155" width="270" height="520" rx="22" fill="#fdf4ff" stroke="#f0abfc" stroke-width="2"/>
  <text x="818" y="192" class="zone-title">WORKFLOW / AI</text>
  <rect x="1100" y="155" width="330" height="520" rx="22" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="1128" y="192" class="zone-title">SERVICE</text>
  <rect x="70" y="715" width="1360" height="70" rx="22" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="98" y="756" class="zone-title">OBSERVABILITY</text>

  <g filter="url(#shadow)"><rect x="110" y="245" width="250" height="86" rx="18" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/><circle cx="145" cy="288" r="20" fill="#2563eb"/><text x="135" y="293" class="badge">SRC</text><text x="180" y="281" class="node-title">Source / Replay</text><text x="180" y="305" class="node-sub">event producers</text></g>
  <g filter="url(#shadow)"><rect x="110" y="425" width="250" height="86" rx="18" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/><circle cx="145" cy="468" r="20" fill="#111827"/><text x="138" y="473" class="badge">K</text><text x="180" y="461" class="node-title">Kafka</text><text x="180" y="485" class="node-sub">live / backfill stream</text></g>
  <g filter="url(#shadow)"><rect x="475" y="395" width="240" height="116" rx="20" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><circle cx="515" cy="453" r="22" fill="#336791"/><text x="505" y="458" class="badge">PG</text><text x="555" y="445" class="node-title">PostgreSQL</text><text x="555" y="471" class="node-sub">operational data store</text></g>
  <g filter="url(#shadow)"><rect x="825" y="245" width="200" height="86" rx="18" fill="#ffffff" stroke="#e879f9" stroke-width="2"/><circle cx="858" cy="288" r="19" fill="#017CEE"/><text x="849" y="293" class="badge">AF</text><text x="892" y="281" class="node-title">Airflow</text><text x="892" y="305" class="node-sub">scheduled work</text></g>
  <g filter="url(#shadow)"><rect x="825" y="425" width="200" height="86" rx="18" fill="#ffffff" stroke="#e879f9" stroke-width="2"/><circle cx="858" cy="468" r="19" fill="#7c3aed"/><text x="849" y="473" class="badge">ML</text><text x="892" y="461" class="node-title">Model Serving</text><text x="892" y="485" class="node-sub">forecast / warning</text></g>
  <g filter="url(#shadow)"><rect x="1145" y="245" width="240" height="86" rx="18" fill="#ffffff" stroke="#4ade80" stroke-width="2"/><circle cx="1180" cy="288" r="19" fill="#38bdf8"/><text x="1170" y="293" class="badge">UI</text><text x="1215" y="281" class="node-title">React / Vite</text><text x="1215" y="305" class="node-sub">operator UI</text></g>
  <g filter="url(#shadow)"><rect x="1145" y="425" width="240" height="86" rx="18" fill="#ffffff" stroke="#4ade80" stroke-width="2"/><circle cx="1180" cy="468" r="19" fill="#009688"/><text x="1171" y="473" class="badge">API</text><text x="1215" y="461" class="node-title">FastAPI</text><text x="1215" y="485" class="node-sub">read / response</text></g>
  <g filter="url(#shadow)"><rect x="1145" y="565" width="240" height="86" rx="18" fill="#ffffff" stroke="#4ade80" stroke-width="2"/><circle cx="1180" cy="608" r="19" fill="#f97316"/><text x="1172" y="613" class="badge">KG</text><text x="1215" y="600" class="node-title">RAG / Vector DB</text><text x="1215" y="624" class="node-sub">documents and ontology</text></g>
  <g filter="url(#shadow)"><rect x="560" y="728" width="350" height="44" rx="16" fill="#ffffff" stroke="#fb923c" stroke-width="2"/><circle cx="590" cy="750" r="16" fill="#f59e0b"/><text x="583" y="755" class="badge">OBS</text><text x="620" y="756" class="node-title">Prometheus / Grafana</text></g>

  <!-- Main stream path -->
  <path class="stream" d="M235 331 L235 415"/>
  <path class="stream" d="M360 468 C400 468 425 453 465 453"/>

  <!-- Work and model interactions around PostgreSQL -->
  <path class="work" d="M715 425 C755 370 775 320 815 288"/>
  <path class="work" d="M715 468 L815 468"/>
  <path class="work" d="M825 490 C775 530 745 535 715 490"/>

  <!-- Service interactions around PostgreSQL -->
  <path class="service" d="M1265 331 L1265 415"/>
  <path class="service" d="M1145 500 C1060 555 890 545 715 490"/>
  <path class="service" d="M1145 608 C1075 585 1075 510 1145 468"/>

  <!-- Monitoring only -->
  <path class="observe" d="M650 728 C600 650 585 560 595 511"/>
  <path class="observe" d="M650 728 C550 610 430 520 360 468"/>
  <path class="observe" d="M760 728 C820 630 855 535 925 511"/>
  <path class="observe" d="M820 728 C990 650 1135 550 1265 511"/>

  <rect x="92" y="810" width="1316" height="38" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="120" y="834" class="legend-title">Legend</text>
  <text x="200" y="834" class="legend-text">blue = Kafka live/backfill stream</text>
  <text x="460" y="834" class="legend-text">green = service request / read path</text>
  <text x="735" y="834" class="legend-text">dark = scheduled/model interaction</text>
  <text x="1010" y="834" class="legend-text">dashed = monitoring only</text>
  <text x="1200" y="834" class="legend-text">details: flow / sequence diagrams</text>
</svg>

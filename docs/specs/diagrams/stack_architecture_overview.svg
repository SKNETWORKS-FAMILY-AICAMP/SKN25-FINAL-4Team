  <use href="#icon-python" x="853" y="204" width="48" height="48"/>
  <text x="915" y="220" class="node-title">Python Consumer</text>
  <text x="915" y="240" class="node-sub">kafka_to_postgres</text>
  <text x="915" y="256" class="tiny">idempotent ledger insert</text>

  <rect x="1135" y="190" width="285" height="75" class="node-strong"/>
  <use href="#icon-postgres" x="1153" y="204" width="48" height="48"/>

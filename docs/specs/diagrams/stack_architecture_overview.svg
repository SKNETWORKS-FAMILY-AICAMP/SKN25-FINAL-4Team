<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1060" viewBox="0 0 1800 1060" role="img" aria-labelledby="title desc">
  <title id="title">CMS Technology Stack Overview</title>
  <desc id="desc">Clean stack overview for CMS AWS live ingestion, PostgreSQL processing branches, service, workflow, and observability.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.16"/></filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M2,2 L12,7 L2,12 Z" fill="#334155"/></marker>
    <style>
      .title{font:800 36px Inter,Arial,sans-serif;fill:#0f172a} .sub{font:500 15px Inter,Arial,sans-serif;fill:#475569}
      .label{font:800 18px Inter,Arial,sans-serif;fill:#0f172a} .note{font:500 12px Inter,Arial,sans-serif;fill:#64748b}
      .node-title{font:800 15px Inter,Arial,sans-serif;fill:#0f172a} .node-sub{font:500 12px Inter,Arial,sans-serif;fill:#475569}
      .tiny{font:500 11px Inter,Arial,sans-serif;fill:#64748b} .chip{font:800 13px Inter,Arial,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:central}
      .boundary{fill:#ffffff;stroke:#0f172a;stroke-width:3} .plane{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}
      .ingest{fill:#eff6ff;stroke:#2563eb} .pg{fill:#ecfeff;stroke:#0891b2} .canon{fill:#f0fdf4;stroke:#16a34a} .model{fill:#faf5ff;stroke:#9333ea} .ops{fill:#fff7ed;stroke:#ea580c} .svc{fill:#eef2ff;stroke:#4f46e5}
      .card{stroke-width:1.8;rx:16;filter:url(#shadow)} .arrow{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}
      .dash{stroke-dasharray:7 7} .guard{fill:#fff7ed;stroke:#fb923c;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1800" height="1060" fill="#f1f5f9"/>
  <rect x="42" y="34" width="1716" height="992" rx="28" class="boundary"/>
  <text x="78" y="88" class="title">CMS Technology Stack Overview</text>
  <text x="78" y="118" class="sub">AWS-main live pipeline: FastAPI -> Kafka -> PostgreSQL ledger -> observed canonical lane and P-Max model-serving lane.</text>
  <text x="1590" y="88" class="tiny" text-anchor="end">source-grounded SVG</text>
  <text x="1590" y="114" class="tiny" text-anchor="end">local = monitoring/control only</text>

  <rect x="78" y="148" width="1644" height="74" rx="20" class="guard"/>
  <text x="106" y="178" class="label">Runtime guardrails</text>
  <text x="310" y="176" class="note">FastAPI remains lightweight</text>
  <text x="560" y="176" class="note">Kafka topic stores observed measurement events</text>
  <text x="900" y="176" class="note">Canonical writes require approval</text>
  <text x="1180" y="176" class="note">P-Max forecast stays in mart / ops / qa</text>
  <text x="1480" y="176" class="note">Grafana is operator-facing</text>

  <!-- Common live path -->
  <rect x="78" y="252" width="1644" height="184" rx="22" class="plane"/>
  <text x="106" y="286" class="label">1. Common live ingestion path</text>
  <text x="106" y="310" class="note">Only AWS services produce/consume the live stream; local machine is not part of the runtime path.</text>
  <g transform="translate(142 336)"><rect width="190" height="82" rx="16" class="card ingest"/><circle cx="36" cy="30" r="20" fill="#2563eb"/><text x="36" y="30" class="chip">SRC</text><text x="72" y="27" class="node-title">Live source</text><text x="72" y="49" class="node-sub">sensor / replay client</text><text x="22" y="70" class="tiny">observed events</text></g>
  <g transform="translate(404 336)"><rect width="190" height="82" rx="16" class="card ingest"/><circle cx="36" cy="30" r="20" fill="#0ea5e9"/><text x="36" y="30" class="chip">API</text><text x="72" y="27" class="node-title">FastAPI</text><text x="72" y="49" class="node-sub">POST /ingest</text><text x="22" y="70" class="tiny">validate + publish</text></g>
  <g transform="translate(666 336)"><rect width="210" height="82" rx="16" class="card ops"/><circle cx="36" cy="30" r="20" fill="#f97316"/><text x="36" y="30" class="chip">K</text><text x="72" y="27" class="node-title">Apache Kafka</text><text x="72" y="49" class="node-sub">measurement_raw_v1</text><text x="22" y="70" class="tiny">DLQ + lag visibility</text></g>
  <g transform="translate(948 336)"><rect width="226" height="82" rx="16" class="card ingest"/><circle cx="36" cy="30" r="20" fill="#0284c7"/><text x="36" y="30" class="chip">PY</text><text x="72" y="27" class="node-title">Python consumer</text><text x="72" y="49" class="node-sub">postgres-live-ingest</text><text x="22" y="70" class="tiny">idempotent DB writer</text></g>
  <g transform="translate(1246 336)"><rect width="260" height="82" rx="16" class="card pg"/><circle cx="36" cy="30" r="20" fill="#0891b2"/><text x="36" y="30" class="chip">PG</text><text x="72" y="27" class="node-title">PostgreSQL live ledger</text><text x="72" y="49" class="node-sub">live.measurement_event</text><text x="22" y="70" class="tiny">trigger -> 1min + bucket_queue</text></g>
  <path class="arrow" d="M332 377 H404"/><path class="arrow" d="M594 377 H666"/><path class="arrow" d="M876 377 H948"/><path class="arrow" d="M1174 377 H1246"/>

  <!-- Branches -->
  <rect x="78" y="468" width="800" height="304" rx="22" class="plane"/>
  <text x="106" y="502" class="label">2A. Observed canonical / QA lane</text>
  <text x="106" y="526" class="note">Observed mean rollups, evidence, anomaly consumers, and controlled promotion.</text>
  <g transform="translate(126 570)"><rect width="188" height="88" rx="16" class="card canon"/><circle cx="36" cy="32" r="20" fill="#16a34a"/><text x="36" y="32" class="chip">MW</text><text x="72" y="29" class="node-title">Mean rollup</text><text x="72" y="51" class="node-sub">15min / 1h</text><text x="22" y="74" class="tiny">coverage + missing</text></g>
  <g transform="translate(370 570)"><rect width="188" height="88" rx="16" class="card canon"/><circle cx="36" cy="32" r="20" fill="#22c55e"/><text x="36" y="32" class="chip">QA</text><text x="72" y="29" class="node-title">QA evidence</text><text x="72" y="51" class="node-sub">eligibility checks</text><text x="22" y="74" class="tiny">issue packet</text></g>
  <g transform="translate(614 570)"><rect width="210" height="88" rx="16" class="card canon"/><circle cx="36" cy="32" r="20" fill="#15803d"/><text x="36" y="32" class="chip">CAN</text><text x="78" y="29" class="node-title">Canonical</text><text x="78" y="51" class="node-sub">measurement_* tables</text><text x="22" y="74" class="tiny">approval-gated promotion</text></g>
  <path class="arrow" d="M314 614 H370"/><path class="arrow" d="M558 614 H614"/>
  <text x="126" y="720" class="note">Rule: peak values, forecasts, corrected/reference values do not become canonical observed facts without approved policy.</text>

  <rect x="922" y="468" width="800" height="304" rx="22" class="plane"/>
  <text x="950" y="502" class="label">2B. Peak feature / P-Max model-serving lane</text>
  <text x="950" y="526" class="note">Forecast serving output is separated from observed canonical data.</text>
  <g transform="translate(970 570)"><rect width="190" height="88" rx="16" class="card model"/><circle cx="36" cy="32" r="20" fill="#9333ea"/><text x="36" y="32" class="chip">PK</text><text x="72" y="29" class="node-title">Peak features</text><text x="72" y="51" class="node-sub">15min + rolling 1h</text><text x="22" y="74" class="tiny">mart.peak_feature</text></g>
  <g transform="translate(1216 570)"><rect width="190" height="88" rx="16" class="card model"/><circle cx="36" cy="32" r="20" fill="#7c3aed"/><text x="36" y="32" class="chip">PM</text><text x="72" y="29" class="node-title">P-Max v29</text><text x="72" y="51" class="node-sub">per-meter ensemble</text><text x="22" y="74" class="tiny">96 x 22 input</text></g>
  <g transform="translate(1462 570)"><rect width="206" height="88" rx="16" class="card model"/><circle cx="36" cy="32" r="20" fill="#6d28d9"/><text x="36" y="32" class="chip">OUT</text><text x="78" y="29" class="node-title">Forecast output</text><text x="78" y="51" class="node-sub">mart / ops / qa</text><text x="22" y="74" class="tiny">not canonical</text></g>
  <path class="arrow" d="M1160 614 H1216"/><path class="arrow" d="M1406 614 H1462"/>
  <text x="970" y="720" class="note">Airflow/scheduler starts model jobs; FastAPI request path does not run blocking inference.</text>

  <!-- Bottom plane -->
  <rect x="78" y="804" width="1644" height="162" rx="22" class="plane"/>
  <text x="106" y="838" class="label">3. Operator, workflow, and knowledge surfaces</text>
  <g transform="translate(136 872)"><rect width="286" height="78" rx="16" class="card svc"/><circle cx="36" cy="30" r="20" fill="#4f46e5"/><text x="36" y="30" class="chip">API</text><text x="76" y="27" class="node-title">Service plane</text><text x="76" y="49" class="node-sub">status, read-only query, artifacts</text></g>
  <g transform="translate(498 872)"><rect width="286" height="78" rx="16" class="card ops"/><circle cx="36" cy="30" r="20" fill="#f97316"/><text x="36" y="30" class="chip">AF</text><text x="76" y="27" class="node-title">Workflow plane</text><text x="76" y="49" class="node-sub">Airflow, report/model jobs</text></g>
  <g transform="translate(860 872)"><rect width="286" height="78" rx="16" class="card ops"/><circle cx="36" cy="30" r="20" fill="#f59e0b"/><text x="36" y="30" class="chip">GF</text><text x="76" y="27" class="node-title">Observability</text><text x="76" y="49" class="node-sub">Grafana + Prometheus</text></g>
  <g transform="translate(1222 872)"><rect width="286" height="78" rx="16" class="card svc"/><circle cx="36" cy="30" r="20" fill="#6366f1"/><text x="36" y="30" class="chip">KB</text><text x="76" y="27" class="node-title">Knowledge layer</text><text x="76" y="49" class="node-sub">Vector DB / LLM Wiki specs</text></g>
  <path class="arrow dash" d="M704 804 C704 760 704 736 704 658"/><path class="arrow dash" d="M1020 804 C1020 760 1020 736 1020 658"/><path class="arrow dash" d="M1000 872 C1100 800 1240 736 1440 658"/>

  <text x="78" y="1002" class="tiny">Source evidence: docker/compose_aws_phase1.yml · docker/compose_aws_db_observability.yml · docker/prometheus/phase1.yml · scripts/migrations/live_schema_draft.sql · src/cms/modeling/pmax_* · docs/specs/project_overview.md</text>
</svg>

  <rect x="24" y="24" width="1552" height="932" class="boundary"/>
  <text x="64" y="76" class="title">CMS Tech Stack Architecture Overview</text>
  <text x="64" y="105" class="subtitle">Common live ingestion with two downstream branches: observed canonical lane and P-Max model-serving lane</text>

  <rect x="60" y="135" width="1480" height="175" class="data-box"/>
  <text x="84" y="165" class="section-title">Data plane: live measurement ingestion</text>


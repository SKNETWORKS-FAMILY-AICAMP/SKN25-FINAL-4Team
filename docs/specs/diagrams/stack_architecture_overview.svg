<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">CMS Tech Stack Architecture Overview</title>
  <desc id="desc">Icon-based overview of CMS live ingestion, canonical branch, peak feature model-serving branch, workflow, service, and observability stacks.</desc>
  <defs>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #475569; }
      .section-title { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .node-title { font: 700 15px Arial, sans-serif; fill: #0f172a; }
      .node-sub { font: 400 12px Arial, sans-serif; fill: #475569; }
      .tiny { font: 400 11px Arial, sans-serif; fill: #64748b; }
      .pill { font: 700 11px Arial, sans-serif; fill: #ffffff; }
      .boundary { fill: #ffffff; stroke: #1e293b; stroke-width: 4; rx: 22; }
      .data-box { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.5; rx: 18; }
      .service-box { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2.5; rx: 18; }
      .workflow-box { fill: #fff7ed; stroke: #ea580c; stroke-width: 2.5; rx: 18; }
      .model-box { fill: #fdf4ff; stroke: #a21caf; stroke-width: 2.5; rx: 18; }
      .obs-box { fill: #ecfdf5; stroke: #059669; stroke-width: 2.5; rx: 18; }
      .node { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 14; }
      .node-strong { fill: #ffffff; stroke: #334155; stroke-width: 2.2; rx: 14; }
      .arrow { fill: none; stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); }
      .arrow-soft { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrow-soft); }
      .arrow-green { fill: none; stroke: #059669; stroke-width: 2.5; marker-end: url(#arrow-green); }
      .arrow-orange { fill: none; stroke: #ea580c; stroke-width: 2.5; marker-end: url(#arrow-orange); }
      .arrow-purple { fill: none; stroke: #a21caf; stroke-width: 2.5; marker-end: url(#arrow-purple); }
      .label { font: 700 12px Arial, sans-serif; fill: #334155; }
      .warning { fill: #fff1f2; stroke: #e11d48; stroke-width: 1.5; rx: 12; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">

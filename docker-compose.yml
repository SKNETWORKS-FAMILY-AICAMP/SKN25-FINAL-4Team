services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: ems-backend
    restart: unless-stopped
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # 학습된 모델 파일 유지
      - ./src/models/forecasting/saved:/app/src/models/forecasting/saved
      - ./src/models/anomaly/saved:/app/src/models/anomaly/saved
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: ems-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

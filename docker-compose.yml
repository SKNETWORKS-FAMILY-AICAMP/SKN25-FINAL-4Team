services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ems-backend
    restart: unless-stopped
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - ML_MODEL_DIR=/app/ml_models
    volumes:
      # 학습된 모델 파일 유지
      - ./backend/src/models/forecasting/saved:/app/src/models/forecasting/saved
      - ./backend/src/models/anomaly/saved:/app/src/models/anomaly/saved
      # ML 팀 학습 모델 (VMD-LSTM, Residual+IF)
      - ../ML/outputs/models:/app/ml_models:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ems-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

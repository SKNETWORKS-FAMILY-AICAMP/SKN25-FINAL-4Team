      margin-bottom: 8px;
      font-size: 13px;

    const viewLabels = {"6year": "6-Year", "yearly": "Yearly", "seasonal": "Seasonal"};
    const meterMeta = {"H1.K11": {"label": "H1.K11 - HVAC 3&5", "description": "HVAC 3&5", "group": "cooling_thermal", "thermal_mode": "cooling"}, "H1.K12": {"label": "H1.K12 - HVAC 2", "description": "HVAC 2", "group": "cooling_thermal", "thermal_mode": "cooling"}, "H1.K14": {"label": "H1.K14 - Office&Reception", "description": "Office&Reception", "group": "cooling_thermal", "thermal_mode": "cooling"}, "H1.K15": {"label": "H1.K15 - HVAC 3", "description": "HVAC 3", "group": "cooling_thermal", "thermal_mode": "cooling"}, "H1.K16": {"label": "H1.K16 - Server O1", "description": "Server O1", "group": "cooling_thermal", "thermal_mode": "cooling"}, "H1.W11": {"label": "H1.W11 - 총 난방", "description": "총 난방", "group": "heating_thermal", "thermal_mode": "heating"}, "H1.W12": {"label": "H1.W12 - CHP 열 생산", "description": "CHP 열 생산", "group": "heating_thermal", "thermal_mode": "heating"}, "H2.K21": {"label": "H2.K21 - Office 냉방", "description": "Office 냉방", "group": "cooling_thermal", "thermal_mode": "cooling"}, "V.K21": {"label": "V.K21 - 중앙 냉수 공급 메인", "description": "중앙 냉수 공급 메인", "group": "cooling_thermal", "thermal_mode": "cooling"}};
    const meterSelect = document.getElementById("meter-select");
    const viewSelect = document.getElementById("view-select");
    const detailSelect = document.getElementById("detail-select");
    const columnSelect = document.getElementById("column-select");
    const detailLabel = document.getElementById("detail-label");
    const metaText = document.getElementById("meta-text");

    function setOptions(selectEl, options) {
      selectEl.innerHTML = "";
      options.forEach((option) => {
        const el = document.createElement("option");
        if (typeof option === "string") {
          el.value = option;
          el.textContent = option;
        } else {
          el.value = option.value;
          el.textContent = option.label;
        }
        selectEl.appendChild(el);
      });
    }

    function initMeterOptions() {
      setOptions(
        meterSelect,
        Object.keys(dashboardData).map((meter) => ({ value: meter, label: meterMeta[meter].label }))
      );
      setOptions(viewSelect, Object.entries(viewLabels).map(([value, label]) => ({ value, label })));
    }

    function getSelectedBlock() {
      return dashboardData[meterSelect.value][viewSelect.value][detailSelect.value];
    }

    function updateDetailOptions() {
      const details = Object.keys(dashboardData[meterSelect.value][viewSelect.value]);
      const label = viewSelect.value === "yearly" ? "Year" : (viewSelect.value === "seasonal" ? "Season" : "Detail");
      detailLabel.textContent = label;
      setOptions(detailSelect, details);
      detailSelect.disabled = viewSelect.value === "6year";
    }

    function updateColumnOptions() {
      const block = getSelectedBlock();
      const options = [{ value: "__all__", label: "All Columns" }].concat(
        block.columns.map((column) => ({ value: column, label: column }))
      );
      setOptions(columnSelect, options);
    }

    function buildHeatmapData(block, selectedColumn) {
      if (selectedColumn === "__all__") {
        return {
          x: block.columns,
          y: block.columns,
          z: block.z,
          titleSuffix: "Full Matrix",
        };
      }

      const idx = block.columns.indexOf(selectedColumn);
      const columnValues = block.z.map((row) => row[idx]);
      return {
        x: block.columns,
        y: [selectedColumn],
        z: [columnValues],
        titleSuffix: `${selectedColumn} vs All`,
      };
    }

    function renderPlot() {
      const meter = meterSelect.value;
      const view = viewSelect.value;
      const detail = detailSelect.value;
      const selectedColumn = columnSelect.value;
      const block = getSelectedBlock();
      const heatmapData = buildHeatmapData(block, selectedColumn);
      const info = meterMeta[meter];

      metaText.textContent =
        `description=${info.description} | group=${info.group} | thermal_mode=${info.thermal_mode} | ` +
        `view=${view} | detail=${detail} | columns=${block.columns.length} | ` +
        `mode=${selectedColumn === "__all__" ? "full" : "single-column"}`;

      Plotly.react("plot", [{
        type: "heatmap",
        x: heatmapData.x,
        y: heatmapData.y,
        z: heatmapData.z,
        zmin: -1,
        zmax: 1,
        colorscale: [
          [0.0, "rgb(103,0,31)"],
          [0.1, "rgb(178,24,43)"],
          [0.2, "rgb(214,96,77)"],
          [0.3, "rgb(244,165,130)"],
          [0.4, "rgb(253,219,199)"],
          [0.5, "rgb(247,247,247)"],
          [0.6, "rgb(209,229,240)"],
          [0.7, "rgb(146,197,222)"],
          [0.8, "rgb(67,147,195)"],
          [0.9, "rgb(33,102,172)"],
          [1.0, "rgb(5,48,97)"]
        ],
        reversescale: true,
        hovertemplate: "x=%{x}<br>y=%{y}<br>corr=%{z:.4f}<extra></extra>",
        text: heatmapData.z,
        texttemplate: "%{text:.2f}",
        textfont: { size: selectedColumn === "__all__" ? 10 : 12 },
        colorbar: { title: { text: "corr" } },
      }], {
        title: { text: `${meterMeta[meter].label} | ${viewLabels[view]} | ${detail} | ${heatmapData.titleSuffix}` },
        paper_bgcolor: "rgba(0,0,0,0)",
        plot_bgcolor: "#ffffff",
        font: { family: "Segoe UI, sans-serif", color: "#20170d" },
        xaxis: {
          tickangle: 0,
          showgrid: false,
        },
        yaxis: {
          autorange: "reversed",
          showgrid: false,
        },
        margin: { l: 100, r: 40, t: 80, b: 140 },
        width: 1320,
        height: selectedColumn === "__all__" ? 920 : 360,
      }, {
        responsive: true,
        displaylogo: false,
      });
    }

    meterSelect.addEventListener("change", () => {
      updateDetailOptions();
      updateColumnOptions();
      renderPlot();
    });

    viewSelect.addEventListener("change", () => {
      updateDetailOptions();
      updateColumnOptions();
      renderPlot();
    });

    detailSelect.addEventListener("change", () => {
      updateColumnOptions();
      renderPlot();
    });

    columnSelect.addEventListener("change", renderPlot);

    initMeterOptions();
    updateDetailOptions();
    updateColumnOptions();
    renderPlot();
  </script>

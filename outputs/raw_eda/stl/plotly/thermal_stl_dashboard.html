<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thermal STL Dashboard</title>
  <script src="https://cdn.plot.ly/plotly-3.1.0.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #f8f4ed 0%, #efe3d1 100%);
      color: #182235;
    }
    .wrap {
      max-width: 1480px;
      margin: 0 auto;
      padding: 24px;
    }
    .panel {
      background: rgba(255, 252, 247, 0.95);
      border: 1px solid #d6e0ef;
      border-radius: 20px;
      box-shadow: 0 18px 50px rgba(25, 43, 84, 0.08);
      padding: 20px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }
    p {
      margin: 0 0 18px;
      color: #53647f;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(2, minmax(220px, 280px));
      gap: 12px;
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #7a5b2a;
      letter-spacing: 0.02em;
    }
    select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #bfd0ea;
      background: #fff;
      color: #182235;
      font-size: 14px;
    }
    .meta {
      margin-bottom: 8px;
      font-size: 13px;
      color: #61728e;
    }
    #plot {
      width: 100%;
      height: 1120px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <h1>Thermal STL Plotly Dashboard</h1>
      <p>계량기와 컬럼을 선택하면 4행 STL 분해 그래프가 같은 x축 범위로 함께 확대/이동됩니다.</p>
      <div class="controls">
        <div>
          <label for="meter-select">Meter</label>
          <select id="meter-select"></select>
        </div>
        <div>
          <label for="feature-select">Column</label>
          <select id="feature-select"></select>
        </div>
      </div>
      <div class="meta" id="meta-text"></div>
      <div id="plot"></div>
    </div>
  </div>
  <script>
    const manifest = {"V.K21": {"label": "V.K21 - 중앙 냉수 공급 메인", "description": "중앙 냉수 공급 메인", "group": "cooling_thermal", "energy_type": "neutral", "features": [{"feature": "P", "unit": "W", "path": "thermal/V.K21/P.js"}, {"feature": "W", "unit": null, "path": "thermal/V.K21/W.js"}, {"feature": "Tvl", "unit": "degC", "path": "thermal/V.K21/Tvl.js"}, {"feature": "Trl", "unit": "degC", "path": "thermal/V.K21/Trl.js"}, {"feature": "Tdiff", "unit": "degC", "path": "thermal/V.K21/Tdiff.js"}, {"feature": "qv", "unit": "m3/h", "path": "thermal/V.K21/qv.js"}, {"feature": "V", "unit": null, "path": "thermal/V.K21/V.js"}, {"feature": "Ta", "unit": "degC", "path": "thermal/V.K21/Ta.js"}, {"feature": "Igm", "unit": "W/m2", "path": "thermal/V.K21/Igm.js"}]}, "H1.K11": {"label": "H1.K11 - HVAC 3&5", "description": "HVAC 3&5", "group": "cooling_thermal", "energy_type": "neutral", "features": [{"feature": "P", "unit": "W", "path": "thermal/H1.K11/P.js"}, {"feature": "W", "unit": null, "path": "thermal/H1.K11/W.js"}, {"feature": "Tvl", "unit": "degC", "path": "thermal/H1.K11/Tvl.js"}, {"feature": "Trl", "unit": "degC", "path": "thermal/H1.K11/Trl.js"}, {"feature": "Tdiff", "unit": "degC", "path": "thermal/H1.K11/Tdiff.js"}, {"feature": "qv", "unit": "m3/h", "path": "thermal/H1.K11/qv.js"}, {"feature": "V", "unit": null, "path": "thermal/H1.K11/V.js"}, {"feature": "Ta", "unit": "degC", "path": "thermal/H1.K11/Ta.js"}, {"feature": "Igm", "unit": "W/m2", "path": "thermal/H1.K11/Igm.js"}]}, "H1.K12": {"label": "H1.K12 - HVAC 2", "description": "HVAC 2", "group": "cooling_thermal", "energy_type": "neutral", "features": [{"feature": "P", "unit": "W", "path": "thermal/H1.K12/P.js"}, {"feature": "W", "unit": null, "path": "thermal/H1.K12/W.js"}, {"feature": "Tvl", "unit": "degC", "path": "thermal/H1.K12/Tvl.js"}, {"feature": "Trl", "unit": "degC", "path": "thermal/H1.K12/Trl.js"}, {"feature": "Tdiff", "unit": "degC", "path": "thermal/H1.K12/Tdiff.js"}, {"feature": "qv", "unit": "m3/h", "path": "thermal/H1.K12/qv.js"}, {"feature": "V", "unit": null, "path": "thermal/H1.K12/V.js"}, {"feature": "Ta", "unit": "degC", "path": "thermal/H1.K12/Ta.js"}, {"feature": "Igm", "unit": "W/m2", "path": "thermal/H1.K12/Igm.js"}]}, "H1.K14": {"label": "H1.K14 - Office&Reception", "description": "Office&Reception", "group": "cooling_thermal", "energy_type": "neutral", "features": [{"feature": "P", "unit": "W", "path": "thermal/H1.K14/P.js"}, {"feature": "W", "unit": null, "path": "thermal/H1.K14/W.js"}, {"feature": "Tvl", "unit": "degC", "path": "thermal/H1.K14/Tvl.js"}, {"feature": "Trl", "unit": "degC", "path": "thermal/H1.K14/Trl.js"}, {"feature": "Tdiff", "unit": "degC", "path": "thermal/H1.K14/Tdiff.js"}, {"feature": "qv", "unit": "m3/h", "path": "thermal/H1.K14/qv.js"}, {"feature": "V", "unit": null, "path": "thermal/H1.K14/V.js"}, {"feature": "Ta", "unit": "degC", "path": "thermal/H1.K14/Ta.js"}, {"feature": "Igm", "unit": "W/m2", "path": "thermal/H1.K14/Igm.js"}]}, "H1.K15": {"label": "H1.K15 - HVAC 3", "description": "HVAC 3", "group": "cooling_thermal", "energy_type": "neutral", "features": [{"feature": "P", "unit": "W", "path": "thermal/H1.K15/P.js"}, {"feature": "W", "unit": null, "path": "thermal/H1.K15/W.js"}, {"feature": "Tvl", "unit": "degC", "path": "thermal/H1.K15/Tvl.js"}, {"feature": "Trl", "unit": "degC", "path": "thermal/H1.K15/Trl.js"}, {"feature": "Tdiff", "unit": "degC", "path": "thermal/H1.K15/Tdiff.js"}, {"feature": "qv", "unit": "m3/h", "path": "thermal/H1.K15/qv.js"}, {"feature": "V", "unit": null, "path": "thermal/H1.K15/V.js"}, {"feature": "Ta", "unit": "degC", "path": "thermal/H1.K15/Ta.js"}, {"feature": "Igm", "unit": "W/m2", "path": "thermal/H1.K15/Igm.js"}]}, "H1.K16": {"label": "H1.K16 - Server O1", "description": "Server O1", "group": "cooling_thermal", "energy_type": "neutral", "features": [{"feature": "P", "unit": "W", "path": "thermal/H1.K16/P.js"}, {"feature": "W", "unit": null, "path": "thermal/H1.K16/W.js"}, {"feature": "Tvl", "unit": "degC", "path": "thermal/H1.K16/Tvl.js"}, {"feature": "Trl", "unit": "degC", "path": "thermal/H1.K16/Trl.js"}, {"feature": "Tdiff", "unit": "degC", "path": "thermal/H1.K16/Tdiff.js"}, {"feature": "qv", "unit": "m3/h", "path": "thermal/H1.K16/qv.js"}, {"feature": "V", "unit": null, "path": "thermal/H1.K16/V.js"}, {"feature": "Ta", "unit": "degC", "path": "thermal/H1.K16/Ta.js"}, {"feature": "Igm", "unit": "W/m2", "path": "thermal/H1.K16/Igm.js"}]}, "H2.K21": {"label": "H2.K21 - Office 냉방", "description": "Office 냉방", "group": "cooling_thermal", "energy_type": "neutral", "features": [{"feature": "P", "unit": "W", "path": "thermal/H2.K21/P.js"}, {"feature": "W", "unit": null, "path": "thermal/H2.K21/W.js"}, {"feature": "Tvl", "unit": "degC", "path": "thermal/H2.K21/Tvl.js"}, {"feature": "Trl", "unit": "degC", "path": "thermal/H2.K21/Trl.js"}, {"feature": "Tdiff", "unit": "degC", "path": "thermal/H2.K21/Tdiff.js"}, {"feature": "qv", "unit": "m3/h", "path": "thermal/H2.K21/qv.js"}, {"feature": "V", "unit": null, "path": "thermal/H2.K21/V.js"}, {"feature": "Ta", "unit": "degC", "path": "thermal/H2.K21/Ta.js"}, {"feature": "Igm", "unit": "W/m2", "path": "thermal/H2.K21/Igm.js"}]}, "H1.W11": {"label": "H1.W11 - 총 난방", "description": "총 난방", "group": "heating_thermal", "energy_type": "neutral", "features": [{"feature": "P", "unit": "W", "path": "thermal/H1.W11/P.js"}, {"feature": "W", "unit": null, "path": "thermal/H1.W11/W.js"}, {"feature": "Tvl", "unit": "degC", "path": "thermal/H1.W11/Tvl.js"}, {"feature": "Trl", "unit": "degC", "path": "thermal/H1.W11/Trl.js"}, {"feature": "Tdiff", "unit": "degC", "path": "thermal/H1.W11/Tdiff.js"}, {"feature": "qv", "unit": "m3/h", "path": "thermal/H1.W11/qv.js"}, {"feature": "V", "unit": null, "path": "thermal/H1.W11/V.js"}, {"feature": "Ta", "unit": "degC", "path": "thermal/H1.W11/Ta.js"}, {"feature": "Igm", "unit": "W/m2", "path": "thermal/H1.W11/Igm.js"}]}, "H1.W12": {"label": "H1.W12 - CHP 열 생산", "description": "CHP 열 생산", "group": "heating_thermal", "energy_type": "neutral", "features": [{"feature": "P", "unit": "W", "path": "thermal/H1.W12/P.js"}, {"feature": "W", "unit": null, "path": "thermal/H1.W12/W.js"}, {"feature": "Tvl", "unit": "degC", "path": "thermal/H1.W12/Tvl.js"}, {"feature": "Trl", "unit": "degC", "path": "thermal/H1.W12/Trl.js"}, {"feature": "Tdiff", "unit": "degC", "path": "thermal/H1.W12/Tdiff.js"}, {"feature": "qv", "unit": "m3/h", "path": "thermal/H1.W12/qv.js"}, {"feature": "V", "unit": null, "path": "thermal/H1.W12/V.js"}, {"feature": "Ta", "unit": "degC", "path": "thermal/H1.W12/Ta.js"}, {"feature": "Igm", "unit": "W/m2", "path": "thermal/H1.W12/Igm.js"}]}};
    const meterSelect = document.getElementById("meter-select");
    const featureSelect = document.getElementById("feature-select");
    const metaText = document.getElementById("meta-text");
    let activeScript = null;

    function setOptions(selectEl, options) {
      selectEl.innerHTML = "";
      options.forEach((option) => {
        const el = document.createElement("option");
        el.value = option.value;
        el.textContent = option.label;
        selectEl.appendChild(el);
      });
    }

    function initMeterOptions() {
      const options = Object.entries(manifest).map(([meter, info]) => {
        return { value: meter, label: info.label };
      });
      setOptions(meterSelect, options);
    }

    function updateFeatureOptions() {
      const meterInfo = manifest[meterSelect.value];
      const options = meterInfo.features.map((item) => {
        const label = item.unit ? `${item.feature} [${item.unit}]` : item.feature;
        return { value: item.feature, label };
      });
      setOptions(featureSelect, options);
    }

    function loadFeaturePayload(path) {
      return new Promise((resolve, reject) => {
        if (activeScript) {
          activeScript.remove();
          activeScript = null;
        }
        delete window.STL_PAYLOAD;
        const script = document.createElement("script");
        script.src = path + "?t=" + Date.now();
        script.onload = () => resolve(window.STL_PAYLOAD);
        script.onerror = () => reject(new Error("payload load failed"));
        activeScript = script;
        document.body.appendChild(script);
      });
    }

    function buildTitle(payload) {
      const unit = payload.unit ? ` [${payload.unit}]` : "";
      return `${payload.meter_urn} - ${payload.feature} STL 분해 (±3σ)${unit}`;
    }

    async function renderPlot() {
      const meterInfo = manifest[meterSelect.value];
      const featureInfo = meterInfo.features.find((item) => item.feature === featureSelect.value);
      if (!featureInfo) {
        return;
      }

      const payload = await loadFeaturePayload(featureInfo.path);
      metaText.textContent =
        `description=${meterInfo.description || "-"} | group=${meterInfo.group || "-"} | ` +
        `energy=${meterInfo.energy_type || "-"} | total=${payload.n_total} | ` +
        `anomaly=${payload.n_anomaly} (${payload.ratio.toFixed(2)}%) | null_ratio=${payload.null_ratio.toFixed(2)}%`;

      const commonLine = {
        mode: "lines",
        type: "scattergl",
        line: { width: 1 },
        hovertemplate: "%{x}<br>%{y}<extra></extra>",
      };

      const traces = [
        {
          ...commonLine,
          x: payload.ts,
          y: payload.observed,
          name: "Observed",
          line: { color: "steelblue", width: 1 },
          xaxis: "x",
          yaxis: "y",
        },
        {
          ...commonLine,
          x: payload.ts,
          y: payload.trend,
          name: "Trend",
          line: { color: "orange", width: 1 },
          xaxis: "x2",
          yaxis: "y2",
        },
        {
          ...commonLine,
          x: payload.ts,
          y: payload.seasonal,
          name: "Seasonal",
          line: { color: "green", width: 1 },
          xaxis: "x3",
          yaxis: "y3",
        },
        {
          ...commonLine,
          x: payload.ts,
          y: payload.residual,
          name: "Residual",
          line: { color: "gray", width: 1 },
          xaxis: "x4",
          yaxis: "y4",
        },
        {
          type: "scattergl",
          mode: "markers",
          x: payload.anomaly_ts,
          y: payload.anomaly_values,
          name: "Residual anomaly",
          marker: { color: "red", size: 5 },
          xaxis: "x4",
          yaxis: "y4",
          hovertemplate: "%{x}<br>anomaly=%{y}<extra></extra>",
        },
      ];

      const annotations = [
        { text: "Observed", x: 0, xref: "paper", y: 1.0, yref: "paper", xanchor: "left", yanchor: "bottom", showarrow: false, font: { size: 12, color: "#182235" } },
        { text: "Trend", x: 0, xref: "paper", y: 0.74, yref: "paper", xanchor: "left", yanchor: "bottom", showarrow: false, font: { size: 12, color: "#182235" } },
        { text: "Seasonal", x: 0, xref: "paper", y: 0.48, yref: "paper", xanchor: "left", yanchor: "bottom", showarrow: false, font: { size: 12, color: "#182235" } },
        { text: "Residual", x: 0, xref: "paper", y: 0.22, yref: "paper", xanchor: "left", yanchor: "bottom", showarrow: false, font: { size: 12, color: "#182235" } },
      ];

      const upperShapes = [0, 1, 2, 3].map((idx) => null).filter(Boolean);
      upperShapes.push(
        {
          type: "line",
          xref: "x4",
          yref: "y4",
          x0: payload.ts[0],
          x1: payload.ts[payload.ts.length - 1],
          y0: payload.upper,
          y1: payload.upper,
          line: { color: "red", width: 1, dash: "dash" },
        },
        {
          type: "line",
          xref: "x4",
          yref: "y4",
          x0: payload.ts[0],
          x1: payload.ts[payload.ts.length - 1],
          y0: payload.lower,
          y1: payload.lower,
          line: { color: "red", width: 1, dash: "dash" },
        },
        {
          type: "line",
          xref: "x4",
          yref: "y4",
          x0: payload.ts[0],
          x1: payload.ts[payload.ts.length - 1],
          y0: payload.mean,
          y1: payload.mean,
          line: { color: "black", width: 1, dash: "dot" },
        }
      );

      const layout = {
        title: { text: buildTitle(payload) },
        paper_bgcolor: "rgba(0,0,0,0)",
        plot_bgcolor: "#ffffff",
        font: { family: "Segoe UI, sans-serif", color: "#182235" },
        hovermode: "x unified",
        showlegend: false,
        margin: { l: 80, r: 30, t: 80, b: 60 },
        height: 1120,
        annotations,
        shapes: upperShapes,
        xaxis: { domain: [0, 1], anchor: "y", matches: "x4", showticklabels: false },
        xaxis2: { domain: [0, 1], anchor: "y2", matches: "x4", showticklabels: false },
        xaxis3: { domain: [0, 1], anchor: "y3", matches: "x4", showticklabels: false },
        xaxis4: { domain: [0, 1], anchor: "y4", rangeslider: { visible: true }, title: { text: "Time" } },
        yaxis: { domain: [0.78, 1.0], title: { text: "Observed" } },
        yaxis2: { domain: [0.52, 0.74], title: { text: "Trend" } },
        yaxis3: { domain: [0.26, 0.48], title: { text: "Seasonal" } },
        yaxis4: { domain: [0.0, 0.22], title: { text: "Residual" } },
      };

      Plotly.react("plot", traces, layout, { responsive: true, displaylogo: false });
    }

    meterSelect.addEventListener("change", async () => {
      updateFeatureOptions();
      await renderPlot();
    });

    featureSelect.addEventListener("change", renderPlot);

    async function init() {
      initMeterOptions();
      updateFeatureOptions();
      await renderPlot();
    }

    init();
  </script>
</body>
</html>

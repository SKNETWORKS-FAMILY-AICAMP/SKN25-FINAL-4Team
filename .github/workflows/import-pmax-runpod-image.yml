name: Build Import P-Max RunPod Image

on:
  push:
    branches:
      - mun/workspace
    paths:
      - Dockerfile.runpod
      - requirements-runpod.txt
      - src/**
      - scripts/**
      - runpod_job/**
      - .github/workflows/import-pmax-runpod-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: import-pmax-runpod-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/sknetworks-family-aicamp/import-pmax-trainer

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=mun-workspace
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runpod
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
